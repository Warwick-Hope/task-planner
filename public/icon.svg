<!--
  The Clarity app mark — the source of every icon in public/.
  Regenerate the PNGs with `npm run build:icons` after changing it.

  Three rounded bars of decreasing length behind their status dots: a plan,
  narrowing as it comes into focus. Drawn on a 512 grid, the group centred on
  (256, 256) so the maskable variant can simply scale it about the centre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#2563eb" />
  <g fill="#ffffff">
    <circle cx="150" cy="176" r="22" />
    <rect x="196" y="156" width="188" height="40" rx="20" />
    <circle cx="150" cy="256" r="22" />
    <rect x="196" y="236" width="146" height="40" rx="20" />
    <circle cx="150" cy="336" r="22" />
    <rect x="196" y="316" width="104" height="40" rx="20" />
  </g>
</svg>
