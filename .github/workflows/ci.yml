name: verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders — env vars are only read at request time (inside
      # functions), never at build time, so the build just needs them present.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run build
